<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>footer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .footer {
            width: 100%;
            height: 470px;
            background: black;
            color: #fff;
            padding: 60px 20px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
        }

        .subscribe {
            padding: 10px 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .subscribe input {
            width: 230px;
            height: 15px;
            border: none;
            border-radius: 70px;
            padding: 12px;
            flex: 1;
        }

        .subscribe button {
            background: #5cc0c8;
            border: none;
            border-radius: 70px;
            padding: 12px 20px;
            color: #fff;
            cursor: pointer;
        }

        .subscribe .social-icons {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .subscribe .social-icons img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .footer-box {
            padding: 10px;
            gap: 60px;
        }


        .footer-box h3 {
            margin-bottom: 20px;
            border-bottom: 2px solid #4da3ff;
            display: inline-block;
            padding-bottom: 5px;
        }


        .footer-box ul li {
            margin-bottom: 10px;
            list-style: none;
        }

        .footer-box ul li a {
            color: white;
            text-decoration: none;
        }

        .footer-box button {
            width: 200px;
            height: 50px;
            border: none;
            border-radius: 70px;
            padding: 10px;
            background: #3a84b4;
            color: #fff;
        }
    </style>
</head>

<body>
    <footer class="footer">
        <div class="container">
            <div class="subscribe">
                <h3>Subscribe for Skin Updates</h3>
                <input type="email" placeholder="Email Address">
                <button>Subscribe</button>
                <div class="social-icons">
                    <img src="https://static.vecteezy.com/system/resources/previews/022/498/377/original/3d-linkedin-logo-icon-isolated-on-transparent-background-free-png.png"
                        alt="">
                    <img src="https://freepnglogo.com/images/all_img/1707222563twitter-logo-png.png" alt="">
                    <img src="https://tse1.mm.bing.net/th/id/OIP.Amcd6uomcBrkzfHXrg14gAHaHa?pid=Api&P=0&h=180" alt="">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="">
                </div>
            </div>
            <div class="footer-box">
                <h3>Company</h3>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Our Doctors</a></li>
                    <li><a href="#">Book Appointment</a></li>
                </ul>
            </div>
            <div class="footer-box">
                <h3>Resources</h3>
                <ul>
                    <li>Skin Care Tips</li>
                    <li>Before & After</li>
                    <li>Patient Reviews</li>
                    <li>Blog</li>
                    <li>FAQs</li>
                </ul>
            </div>
            <div class="footer-box">
                <h3>Contact</h3>
                <p>123 SkinCare Clinic, City Name</p>
                <p>support@yourclinic.com</p>
                <p>+91 12345 67890</p>
                <button>Free Consultation</button>
            </div>
        </div>
    </footer>
</body>

</html>
