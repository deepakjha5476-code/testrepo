<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .top-bar {
            width: 100%;
            height: 70px;
            background: #4aa3ad;
            color: white;
            display: flex;
            justify-content: space-between;
            padding: 8px 40px;
            font-size: 14px;
        }

        .navbar {
            width: 90%;
            background: #fff;
            margin: -35px auto -35px;
            position: relative;
            z-index: 10;
            border-radius: 17px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .navbar h1 {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li {
            cursor: pointer;
            color: #333;
        }

        .navbar button {
            background: #4aa3ad;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <div class="left">
            📞 +91 00000 00000
            <span> | </span>
            ✉ info@pinuxi.com
        </div>
        <div class="right">
            ✉ info@pinuxi.com
        </div>
    </div>
    <div class="navbar">
        <h1>LOGO</h1>
        <ul class="nav-links">
            <li>Home</li>
            <li>About us</li>
            <li>Products</li>
            <li>Services</li>
            <li>Blog</li>
            <li>Contact Us</li>
        </ul>
        <button>Book Appointment</button>
    </div>
</body>

</html>
